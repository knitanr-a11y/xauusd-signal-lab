name: GOLD_ML_V1 Audit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/gold_ml_v1/cost_stress/**"
      - "scripts/gold_ml_v1/prospective/**"
      - "scripts/gold_ml_v1/monitoring/**"
      - "scripts/gold_ml_v1/exploration/**"
      - "scripts/gold_ml_v1/live_research_challenger/**"
      - "scripts/gold_ml_v1/run_next_local.py"
      - "RUN_GOLD_ML_V1_NEXT.bat"
      - "config/gold_ml_v1/**"
      - "docs/gold_ml_v1/**"
      - "tests/gold_ml_v1/**"
      - "AGENTS.md"
      - "START_HERE_GOLD_ML_V1_NEXT_CHAT.md"
      - ".github/workflows/gold_ml_v1_cost_stress_tests.yml"
  pull_request:
    paths:
      - "scripts/gold_ml_v1/cost_stress/**"
      - "scripts/gold_ml_v1/prospective/**"
      - "scripts/gold_ml_v1/monitoring/**"
      - "scripts/gold_ml_v1/exploration/**"
      - "scripts/gold_ml_v1/live_research_challenger/**"
      - "scripts/gold_ml_v1/run_next_local.py"
      - "RUN_GOLD_ML_V1_NEXT.bat"
      - "config/gold_ml_v1/**"
      - "docs/gold_ml_v1/**"
      - "tests/gold_ml_v1/**"
      - "AGENTS.md"
      - "START_HERE_GOLD_ML_V1_NEXT_CHAT.md"
      - ".github/workflows/gold_ml_v1_cost_stress_tests.yml"

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.1
      - name: Compile tools
        run: |
          python -m py_compile scripts/gold_ml_v1/cost_stress/cost_stress_contract.py
          python -m py_compile scripts/gold_ml_v1/cost_stress/cost_stress_engine.py
          python -m py_compile scripts/gold_ml_v1/cost_stress/cost_stress_reports.py
          python -m py_compile scripts/gold_ml_v1/cost_stress/run_cost_stress_raw_reconstructed.py
          python -m py_compile scripts/gold_ml_v1/prospective/fresh_prospective_engine.py
          python -m py_compile scripts/gold_ml_v1/prospective/run_fresh_prospective_confirmation.py
          python -m py_compile scripts/gold_ml_v1/monitoring/prospective_monitor_state.py
          python -m py_compile scripts/gold_ml_v1/monitoring/run_prospective_monitor_cycle.py
          python -m py_compile scripts/gold_ml_v1/exploration/batch024_pullback_engine.py
          python -m py_compile scripts/gold_ml_v1/exploration/run_batch024_pullback_exploration.py
          python -m py_compile scripts/gold_ml_v1/exploration/package_batch024_raw_for_assistant.py
          python -m py_compile scripts/gold_ml_v1/exploration/run_batch024_local_reproduction.py
          python -m py_compile scripts/gold_ml_v1/exploration/run_prov030a_local_reproduction.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_settings.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_win_rate.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_discord.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_mt5.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_execution.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_execution_supervisor.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/run_live_once.py
          python -m py_compile scripts/gold_ml_v1/run_next_local.py
      - name: Test governance guardrails
        run: python -m unittest tests/gold_ml_v1/test_exploration_guardrails.py -v
      - name: Test live Discord and MT5 execution adapter
        run: |
          python -m pytest tests/gold_ml_v1/test_live_execution_delivery.py -q
          python -m pytest tests/gold_ml_v1/test_live_execution_supervisor.py -q
      - name: Test cost stress contract
        run: python -m unittest tests/gold_ml_v1/test_cost_stress_contract.py -v
      - name: Test cost stress core registry
        run: python -m unittest tests/gold_ml_v1/test_cost_stress_core_registry_fix.py -v
      - name: Test fresh prospective engine
        run: python -m unittest tests/gold_ml_v1/test_fresh_prospective_engine.py -v
      - name: Test stateful prospective monitor
        run: python -m unittest tests/gold_ml_v1/test_prospective_monitor_state.py -v
      - name: Test Batch024 exploration
        run: python -m unittest tests/gold_ml_v1/test_exploration_batch024.py -v
      - name: Test Batch024 RAW package transfer
        run: python -m unittest tests/gold_ml_v1/test_batch024_raw_package.py -v
      - name: Test Batch024 local reproduction
        run: python -m unittest tests/gold_ml_v1/test_batch024_local_reproduction.py -v
