name: GOLD_ML_V1 Audit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/gold_ml_v1/cost_stress/**"
      - "scripts/gold_ml_v1/prospective/**"
      - "scripts/gold_ml_v1/run_next_local.py"
      - "RUN_GOLD_ML_V1_NEXT.bat"
      - "config/gold_ml_v1/cost_stress_raw_reconstructed_20260625.json"
      - "config/gold_ml_v1/cost_stress_raw_reconstructed_pass_20260625.json"
      - "config/gold_ml_v1/fresh_prospective_confirmation_20260625.json"
      - "config/gold_ml_v1/current_state_snapshot_20260624.json"
      - "config/gold_ml_v1/next_local_action.json"
      - "docs/gold_ml_v1/**"
      - "tests/gold_ml_v1/**"
      - "AGENTS.md"
      - "START_HERE_GOLD_ML_V1_NEXT_CHAT.md"
      - ".github/workflows/gold_ml_v1_cost_stress_tests.yml"
  pull_request:
    paths:
      - "scripts/gold_ml_v1/cost_stress/**"
      - "scripts/gold_ml_v1/prospective/**"
      - "scripts/gold_ml_v1/run_next_local.py"
      - "RUN_GOLD_ML_V1_NEXT.bat"
      - "config/gold_ml_v1/**"
      - "docs/gold_ml_v1/**"
      - "tests/gold_ml_v1/**"
      - "AGENTS.md"
      - "START_HERE_GOLD_ML_V1_NEXT_CHAT.md"
      - ".github/workflows/gold_ml_v1_cost_stress_tests.yml"

jobs:
  audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Compile tools
        run: |
          python -m py_compile scripts/gold_ml_v1/cost_stress/cost_stress_contract.py
          python -m py_compile scripts/gold_ml_v1/cost_stress/cost_stress_engine.py
          python -m py_compile scripts/gold_ml_v1/cost_stress/cost_stress_reports.py
          python -m py_compile scripts/gold_ml_v1/cost_stress/run_cost_stress_raw_reconstructed.py
          python -m py_compile scripts/gold_ml_v1/prospective/fresh_prospective_engine.py
          python -m py_compile scripts/gold_ml_v1/prospective/run_fresh_prospective_confirmation.py
          python -m py_compile scripts/gold_ml_v1/run_next_local.py
      - name: Run tests
        run: |
          python -m unittest tests/gold_ml_v1/test_exploration_guardrails.py -v
          python -m unittest tests/gold_ml_v1/test_cost_stress_contract.py -v
          python -m unittest tests/gold_ml_v1/test_cost_stress_core_registry_fix.py -v
          python -m unittest tests/gold_ml_v1/test_fresh_prospective_engine.py -v
