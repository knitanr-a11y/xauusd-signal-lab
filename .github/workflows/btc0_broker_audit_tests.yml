name: BTC-0 Broker and History Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "RUN_BTCUSD_HISTORY_EXPORT.bat"
      - "scripts/btc_ml_v1/**"
      - "tests/btc_ml_v1/test_btc0_mt5_audit.py"
      - "tests/btc_ml_v1/test_btc_history_export.py"
      - "tests/btc_ml_v1/test_btc_history_runner.py"
      - "tests/btc_ml_v1/test_btc3_video_ema_method.py"
      - "docs/btc_ml_v1/**"
      - "configs/btc_ml_v1/**"
      - ".github/workflows/btc0_broker_audit_tests.yml"
  pull_request:
    paths:
      - "RUN_BTCUSD_HISTORY_EXPORT.bat"
      - "scripts/btc_ml_v1/**"
      - "tests/btc_ml_v1/test_btc0_mt5_audit.py"
      - "tests/btc_ml_v1/test_btc_history_export.py"
      - "tests/btc_ml_v1/test_btc_history_runner.py"
      - "tests/btc_ml_v1/test_btc3_video_ema_method.py"
      - "docs/btc_ml_v1/**"
      - "configs/btc_ml_v1/**"
      - ".github/workflows/btc0_broker_audit_tests.yml"

jobs:
  btc0-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.1
      - name: Enforce no-order no-Discord boundary
        shell: bash
        run: |
          if grep -R -n -E "\.order_send[[:space:]]*\(|send_webhook[[:space:]]*\(" scripts/btc_ml_v1; then
            echo "BTC audit/history code must not contain order or Discord send calls"
            exit 1
          fi
      - name: Compile BTC tools
        run: |
          python -m py_compile scripts/btc_ml_v1/broker_audit/btc0_mt5_audit.py
          python -m py_compile scripts/btc_ml_v1/data_history/export_btcusdsharp_history.py
          python -m py_compile scripts/btc_ml_v1/data_history/run_btcusdsharp_history.py
          python -m py_compile scripts/btc_ml_v1/data_history/build_btcusd_chat_package.py
          python -m py_compile scripts/btc_ml_v1/research/btc3_video_ema_method_exploration.py
          python -m py_compile scripts/btc_ml_v1/research/run_btc3_video_ema_user_contract.py
      - name: Test read-only broker and data audit
        run: python -m pytest tests/btc_ml_v1/test_btc0_mt5_audit.py -q
      - name: Test staged closed-only history export
        run: python -m pytest tests/btc_ml_v1/test_btc_history_export.py -q
      - name: Test compressed package and failed-run cleanup
        run: python -m pytest tests/btc_ml_v1/test_btc_history_runner.py -q
      - name: Test BTC-3 video EMA research contracts
        run: python -m pytest tests/btc_ml_v1/test_btc3_video_ema_method.py -q
