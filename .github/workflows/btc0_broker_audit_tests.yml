name: BTC-0 Broker Audit Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/btc_ml_v1/broker_audit/**"
      - "tests/btc_ml_v1/test_btc0_mt5_audit.py"
      - "docs/btc_ml_v1/BTC0_BROKER_DATA_AUDIT.md"
      - ".github/workflows/btc0_broker_audit_tests.yml"
  pull_request:
    paths:
      - "scripts/btc_ml_v1/broker_audit/**"
      - "tests/btc_ml_v1/test_btc0_mt5_audit.py"
      - "docs/btc_ml_v1/BTC0_BROKER_DATA_AUDIT.md"
      - ".github/workflows/btc0_broker_audit_tests.yml"

jobs:
  btc0-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.1
      - name: Enforce read-only boundary
        shell: bash
        run: |
          if grep -R -n -E "order_send|send_webhook" scripts/btc_ml_v1/broker_audit; then
            echo "BTC-0 audit must not contain order or Discord send calls"
            exit 1
          fi
      - name: Compile BTC-0 audit
        run: python -m py_compile scripts/btc_ml_v1/broker_audit/btc0_mt5_audit.py
      - name: Test read-only broker and data audit
        run: python -m pytest tests/btc_ml_v1/test_btc0_mt5_audit.py -q
