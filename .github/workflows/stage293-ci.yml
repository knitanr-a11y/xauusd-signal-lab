name: Stage293 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  resolved-base-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas pytest lightgbm
      - run: python -m compileall -q scripts/gold_v3_runtime/gold_v3_292_*.py scripts/gold_v3_runtime/gold_v3_293_*.py
      - run: python -m pytest -q tests/gold_v3/test_stage292_safe_portfolio_live.py tests/gold_v3/test_stage293_base_health_live.py
