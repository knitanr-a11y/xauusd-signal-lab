name: BTC AI V1 Binance derivatives state

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/btc_ai_v1_binance_derivatives_state.yml
      - scripts/btc_ai_v1/download_binance_derivatives_state.py

permissions:
  contents: read

jobs:
  acquire:
    name: ${{ matrix.dataset }} ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dataset: markPriceKlines, year: 2020}
          - {dataset: markPriceKlines, year: 2021}
          - {dataset: markPriceKlines, year: 2022}
          - {dataset: premiumIndexKlines, year: 2020}
          - {dataset: premiumIndexKlines, year: 2021}
          - {dataset: premiumIndexKlines, year: 2022}
          - {dataset: indexPriceKlines, year: 2020}
          - {dataset: indexPriceKlines, year: 2021}
          - {dataset: indexPriceKlines, year: 2022}
          - {dataset: metrics, year: 2021}
          - {dataset: metrics, year: 2022}
    steps:
      - uses: actions/checkout@v4
      - name: Download, checksum and merge official archives
        run: |
          python scripts/btc_ai_v1/download_binance_derivatives_state.py \
            --dataset "${{ matrix.dataset }}" \
            --year "${{ matrix.year }}" \
            --output-dir "artifacts/${{ matrix.dataset }}_${{ matrix.year }}"
      - uses: actions/upload-artifact@v4
        with:
          name: btc-ai-v1-${{ matrix.dataset }}-${{ matrix.year }}
          path: artifacts/${{ matrix.dataset }}_${{ matrix.year }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
