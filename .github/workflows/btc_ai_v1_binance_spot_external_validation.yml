name: BTC AI V1 Binance spot external validation data

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/btc_ai_v1_binance_spot_external_validation.yml
      - scripts/btc_ai_v1/download_binance_spot_external_validation.py

permissions:
  contents: read

jobs:
  acquire:
    name: Binance spot BTCUSDT ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        year: [2018, 2019]
    steps:
      - uses: actions/checkout@v4
      - name: Download, checksum and audit official Binance spot archives
        run: |
          python scripts/btc_ai_v1/download_binance_spot_external_validation.py \
            --year "${{ matrix.year }}" \
            --output-dir "artifacts/binance_spot_btcusdt_${{ matrix.year }}"
      - name: Upload yearly artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-ai-v1-binance-spot-btcusdt-${{ matrix.year }}
          path: artifacts/binance_spot_btcusdt_${{ matrix.year }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
