name: BTC AI V1 Binance derivatives archive probe

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/btc_ai_v1_binance_derivatives_archive_probe.yml
      - scripts/btc_ai_v1/probe_binance_derivatives_archives.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe official archive paths
        run: python scripts/btc_ai_v1/probe_binance_derivatives_archives.py
      - uses: actions/upload-artifact@v4
        with:
          name: btc-ai-v1-binance-derivatives-archive-probe
          path: artifacts/binance_derivatives_archive_probe
          if-no-files-found: error
          retention-days: 14
