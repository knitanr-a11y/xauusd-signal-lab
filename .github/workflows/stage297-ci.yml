name: Stage297 CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/gold_v3_runtime/gold_v3_289_stage280_features.py'
      - 'scripts/gold_v3_runtime/gold_v3_289_train_live_models_audit.py'
      - 'tests/gold_v3/test_stage294_training_history.py'
      - '.github/workflows/stage297-ci.yml'
  workflow_dispatch:

jobs:
  stage280-parity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas pytest lightgbm
      - run: python -m compileall -q scripts/gold_v3_runtime/gold_v3_289_stage280_features.py scripts/gold_v3_runtime/gold_v3_289_train_live_models_audit.py
      - run: python -m pytest -q tests/gold_v3/test_stage294_training_history.py
