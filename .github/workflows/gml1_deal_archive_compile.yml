name: GML1 Deal Archive Compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/gold_ml_v1/live_research_challenger/live_deal_archive.py"
      - "scripts/gold_ml_v1/live_research_challenger/live_deal_archive_strict.py"
      - "scripts/gold_ml_v1/live_research_challenger/live_execution_deal_safe.py"
      - "scripts/gold_ml_v1/live_research_challenger/live_autotrade_profile.py"
      - "scripts/gold_ml_v1/live_research_challenger/run_live_connected_once.py"
      - "scripts/gold_ml_v1/live_research_challenger/run_live_gold_hash_once.py"
      - "scripts/gold_ml_v1/live_research_challenger/verify_deal_archive_contract.py"
      - ".github/workflows/gml1_deal_archive_compile.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3
      - name: Compile
        run: |
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_deal_archive.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_deal_archive_strict.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_execution_deal_safe.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_autotrade_profile.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/run_live_connected_once.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/run_live_gold_hash_once.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/verify_deal_archive_contract.py
      - name: Verify archive contract
        run: python scripts/gold_ml_v1/live_research_challenger/verify_deal_archive_contract.py
