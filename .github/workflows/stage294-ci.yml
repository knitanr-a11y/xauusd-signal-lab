name: Stage294-295 CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  training-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas pytest lightgbm
      - run: python -m compileall -q scripts/gold_v3_runtime/gold_v3_289_training_history_preflight.py scripts/gold_v3_runtime/gold_v3_289_stage280_features.py scripts/gold_v3_runtime/gold_v3_289_train_live_models_audit.py scripts/gold_v3_runtime/gold_v3_295_stage280_population_diagnostic.py
      - run: python -m pytest -q tests/gold_v3/test_stage294_training_history.py
