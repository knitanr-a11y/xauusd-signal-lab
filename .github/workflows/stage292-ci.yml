name: Stage292 CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/gold_v3_runtime/gold_v3_292_*.py'
      - 'tests/gold_v3/test_stage292_safe_portfolio_live.py'
      - 'docs/gold_v3/gold_v3_stage292_safe_portfolio_bootstrap.json'
      - '.github/workflows/stage292-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  safe-portfolio-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas pytest lightgbm
      - run: python -m compileall -q scripts/gold_v3_runtime/gold_v3_292_*.py
      - run: python -m pytest -q tests/gold_v3/test_stage292_safe_portfolio_live.py
