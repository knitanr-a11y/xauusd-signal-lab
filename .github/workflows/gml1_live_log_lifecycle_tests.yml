name: GML1 Live Log Lifecycle Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/gold_ml_v1/live_research_challenger/**"
      - "tests/gold_ml_v1/test_live_always_on.py"
      - "tests/gold_ml_v1/test_live_execution_live_wr.py"
      - "tests/gold_ml_v1/test_live_execution_supervisor.py"
      - "tests/gold_ml_v1/test_live_feature_archive.py"
      - "tests/gold_ml_v1/test_live_log_manager.py"
      - ".github/workflows/gml1_live_log_lifecycle_tests.yml"
  pull_request:
    paths:
      - "scripts/gold_ml_v1/live_research_challenger/**"
      - "tests/gold_ml_v1/test_live_always_on.py"
      - "tests/gold_ml_v1/test_live_execution_live_wr.py"
      - "tests/gold_ml_v1/test_live_execution_supervisor.py"
      - "tests/gold_ml_v1/test_live_feature_archive.py"
      - "tests/gold_ml_v1/test_live_log_manager.py"
      - ".github/workflows/gml1_live_log_lifecycle_tests.yml"

jobs:
  live-log-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy==2.1.3 pandas==2.2.3 pytest==8.4.1
      - name: Compile live log tools
        run: |
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_log_manager.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_execution_live_wr.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/live_feature_archive.py
          python -m py_compile scripts/gold_ml_v1/live_research_challenger/rotate_live_loop_log.py
      - name: Test always-on policy
        run: python -m pytest tests/gold_ml_v1/test_live_always_on.py -q
      - name: Test log lifecycle
        run: python -m pytest tests/gold_ml_v1/test_live_log_manager.py -q
      - name: Test permanent entry feature snapshots
        run: python -m pytest tests/gold_ml_v1/test_live_feature_archive.py -q
      - name: Re-run existing live safety tests
        run: |
          python -m pytest tests/gold_ml_v1/test_live_execution_live_wr.py -q
          python -m pytest tests/gold_ml_v1/test_live_execution_supervisor.py -q
