name: Stage290 CI

on:
  pull_request:
    branches:
      - stage289_live_candle_ml_safe_shadow_audit_v2
  workflow_dispatch:

jobs:
  causal-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pandas pytest
      - run: python -m compileall -q scripts/gold_v3_runtime/gold_v3_290_*.py
      - run: python -m pytest -q tests/gold_v3/test_stage290_live_safe_portfolio.py
