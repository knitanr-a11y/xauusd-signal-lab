name: GOLD_ML_V1 Batch023 Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "RUN_GOLD_ML_V1_NEXT.bat"
      - "scripts/gold_ml_v1/**"
      - "config/gold_ml_v1/**"
      - "tests/gold_ml_v1/**"
      - ".github/workflows/gold_ml_v1_batch023_tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/gold_ml_v1/replay/requirements-local-replay.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/gold_ml_v1/replay/requirements-local-replay.txt

      - name: Compile tools
        run: |
          python -m py_compile scripts/gold_ml_v1/run_next_local.py
          python -m py_compile scripts/gold_ml_v1/replay/batch023_warmup_bridge_reconstruction.py
          python -m py_compile scripts/gold_ml_v1/replay/run_batch023_warmup_bridge_local.py
          python -m py_compile scripts/gold_ml_v1/replay/run_frozen_batch023_from_zip.py
          python -m py_compile scripts/gold_ml_v1/replay/nine_candidate_local_replay.py
          python -m py_compile scripts/gold_ml_v1/replay/nine_candidate_local_replay_v2.py
          python -m py_compile scripts/gold_ml_v1/replay/nine_candidate_local_replay_v3.py
          python -m py_compile scripts/gold_ml_v1/replay/nine_candidate_local_replay_v4.py
          python -m py_compile scripts/gold_ml_v1/replay/replay_v4_entry.py
          python -m py_compile scripts/gold_ml_v1/replay/replay_v5_entry.py
          python -m py_compile scripts/gold_ml_v1/replay/fast_m1_engine_hotfix.py
          python -m py_compile scripts/gold_ml_v1/replay/goldsharp_live_source_preflight.py
          python -m py_compile scripts/gold_ml_v1/tools/install_batch023_local_replay_artifacts.py

      - name: Run unit tests
        run: |
          python -m unittest tests/gold_ml_v1/test_run_next_local.py -v
          python -m unittest tests/gold_ml_v1/test_nine_candidate_local_replay.py -v
          python -m unittest tests/gold_ml_v1/test_nine_candidate_local_replay_v2.py -v
          python -m unittest tests/gold_ml_v1/test_nine_candidate_local_replay_v3.py -v
          python -m unittest tests/gold_ml_v1/test_fast_m1_engine_hotfix.py -v
          python -m unittest tests/gold_ml_v1/test_goldsharp_live_source_preflight.py -v
